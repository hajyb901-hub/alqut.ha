<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متسابق 🎭 | التكاذيب — لقطتها</title>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;padding:18px}.player-wrap{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:16px}.player-header{display:flex;justify-content:space-between;align-items:center;gap:10px}.player-header h1{font-family:var(--font-display);font-size:1.5rem}.player-room{font-size:.85rem;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg-panel)}
.p-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.18)}.p-q{font-size:1.25rem;line-height:1.8;font-weight:800;margin-bottom:16px}.p-phase{font-family:var(--font-display);font-size:1.1rem;margin-bottom:8px}.identity-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.identity-btn{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg-panel-2);font-weight:800;cursor:pointer}.identity-btn.active{border-color:var(--yellow);box-shadow:0 0 20px var(--yellow-glow)}.p-input{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:16px;background:var(--bg-panel-2);color:var(--text-1);padding:15px;font:inherit;outline:none}.p-submit{width:100%;margin-top:10px;padding:14px;border:0;border-radius:15px;background:var(--yellow);color:#111;font-weight:900;cursor:pointer}.p-submit:disabled{opacity:.45;cursor:not-allowed}.p-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.p-option{padding:18px;text-align:right;border:1px solid var(--line);border-radius:16px;background:var(--bg-panel-2);color:var(--text-1);font:inherit;font-weight:800;cursor:pointer;min-height:70px}.p-option.selected{border-color:var(--cyan);box-shadow:0 0 24px rgba(34,211,238,.16)}.p-option:disabled{cursor:default}.p-status{text-align:center;color:var(--text-3);line-height:1.7}.p-results{display:flex;flex-direction:column;gap:9px}.p-result{display:flex;justify-content:space-between;gap:10px;padding:12px;border-radius:13px;background:var(--bg-panel-2);border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:600px){.p-options,.identity-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg-glow"></div><div class="bg-dots"></div>
<div class="player-wrap">
  <header class="player-header"><h1>🎭 التكاذيب</h1><span class="player-room" id="roomLabel">غرفة —</span></header>
  <div class="p-card" id="joinCard">
    <div class="p-phase">👤 اختر اسمك</div><p class="p-status">كل جهاز يختار لاعبًا واحدًا فقط.</p>
    <div class="identity-grid" id="identityGrid"></div>
  </div>
  <div class="p-card hidden" id="gameCard">
    <div class="p-phase" id="phaseText">بانتظار الجولة…</div>
    <div class="p-q" id="question">—</div>
    <div id="writingBox"><textarea id="answerInput" class="p-input" maxlength="120" placeholder="اكتب إجابتك… ممكن تكون الصحيحة أو كذبة تقنع الآخرين 😈"></textarea><button id="submitBtn" class="p-submit">إرسال الإجابة 🚀</button></div>
    <div id="votingBox" class="hidden"><div class="p-options" id="options"></div><p class="p-status" id="voteStatus"></p></div>
    <div id="judgeWait" class="hidden"><p class="p-status">⚖️ لم يكتب أحد الإجابة الصحيحة. الحكم يجهز الإجابة الصحيحة الآن…</p></div>
    <div id="resultsBox" class="hidden"><div class="p-results" id="results"></div><p class="p-status" id="myDelta"></p></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="room-sync.js?v=20260917"></script>
<script>
let sync=null,state=null,myId=null,tick=null;
const qs=new URLSearchParams(location.search), room=(qs.get('room')||'').toUpperCase();
const key='laqtaha_fibbage_player_'+room;
const saved=localStorage.getItem(key); if(saved) myId=saved;
document.getElementById('roomLabel').textContent='غرفة '+(room||'—');
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function connect(){
 if(!room){document.getElementById('joinCard').innerHTML='<p class="p-status">افتح رابط اللاعبين الذي ينسخه صاحب الغرفة بعد بدء اللعبة.</p>';return;}
 sync=new RoomSync(room);sync.onStateUpdate=applyState;sync.onPlayerAction=()=>{};sync.connect();sync.startPolling(2500);sync.fetchState().then(s=>s&&applyState(s));
}
function choose(id){myId=id;localStorage.setItem(key,id);renderIdentity();renderState()}
function renderIdentity(){const g=document.getElementById('identityGrid');if(!state?.players)return;g.innerHTML=state.players.map(p=>`<button class="identity-btn ${p.id===myId?'active':''}" onclick="choose('${p.id}')">${p.avatar} ${esc(p.name)}</button>`).join('')}
function send(type,payload){if(sync)sync.sendPlayerAction(Object.assign({type,playerId:myId},payload||{}))}
function submit(){const v=document.getElementById('answerInput').value.trim();if(!myId||!v)return;send('fibbageSubmit',{text:v})}
function vote(id){if(!myId)return;send('fibbageVote',{optionId:id})}
document.getElementById('submitBtn').onclick=submit;
function applyState(s){if(!s||s.mode!=='fibbage')return;state=s;renderIdentity();document.getElementById('joinCard').classList.toggle('hidden',!!myId&&!!state.players.find(p=>p.id===myId));document.getElementById('gameCard').classList.toggle('hidden',!myId);renderState()}
function renderState(){if(!state||!myId)return;const f=state.fibbage,cur=state.deck[state.currentIndex];if(!f||!cur)return;document.getElementById('question').textContent=cur.q;const labels={writing:'✍️ اكتب إجابتك',judge_answer:'⚖️ انتظر الحكم',voting:'🗳️ اختر الإجابة الصحيحة',results:'🏆 النتائج'};document.getElementById('phaseText').textContent=labels[f.phase]||f.phase;
 const submitted=f.submissions?.[myId];const wb=document.getElementById('writingBox'),vb=document.getElementById('votingBox'),jw=document.getElementById('judgeWait'),rb=document.getElementById('resultsBox');wb.classList.toggle('hidden',f.phase!=='writing');vb.classList.toggle('hidden',f.phase!=='voting');jw.classList.toggle('hidden',f.phase!=='judge_answer');rb.classList.toggle('hidden',f.phase!=='results');
 const input=document.getElementById('answerInput'),btn=document.getElementById('submitBtn');if(input){if(submitted)input.value=submitted.text;input.disabled=!!submitted;btn.disabled=!!submitted||!myId}
 if(f.phase==='voting'){const wrap=document.getElementById('options');wrap.innerHTML=f.options.map(o=>`<button class="p-option ${f.votes?.[myId]===o.id?'selected':''}" ${f.votes?.[myId]?'disabled':''} onclick="vote('${o.id}')">❔ ${esc(o.text)}</button>`).join('');document.getElementById('voteStatus').textContent=f.votes?.[myId]?'تم تسجيل صوتك ✓':'الأسماء مخفية — اختر الإجابة التي تراها صحيحة.'}
 if(f.phase==='results'){const wrap=document.getElementById('results');wrap.innerHTML=f.options.map(o=>{const owner=o.real?'الإجابة الصحيحة':(o.playerIds||[]).map(id=>state.players.find(p=>p.id===id)?.name||'لاعب').join(' + ')||'أضافه الحكم';return `<div class="p-result"><span><b>${esc(o.text)}</b><small style="display:block;color:var(--text-3)">${esc(owner)}</small></span><strong>${f.results?.counts?.[o.id]||0} صوت</strong></div>`}).join('');document.getElementById('myDelta').textContent='نتيجتك في الجولة: +'+(f.results?.deltas?.[myId]||0)+' نقطة'}
}
connect();
</script>
</body></html>
